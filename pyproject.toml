[project]
name = "research-rag-assistant"
version = "0.1.0"
description = "Local-first RAG assistant for querying academic PDFs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.mypy]
files = ["app", "scripts", "tests"]
strict = true
explicit_package_bases = true
follow_imports = "silent"

# These dependencies do not provide complete type information.
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "playwright>=1.63.0",
]
