name: Regression checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Python, UI and types
    # Match the local Apple Silicon target and avoid Linux's CUDA dependencies.
    runs-on: macos-15
    timeout-minutes: 20
    env:
      RAG_DATABASE_URL: "sqlite:///:memory:"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true

      - name: Install project Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Python regressions
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Browser logic regressions
        run: node --test tests/test_ui_rendering.js

      - name: Strict type checking
        run: uv run --locked mypy
